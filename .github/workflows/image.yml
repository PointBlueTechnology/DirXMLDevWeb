# The hosted image on GHCR: ghcr.io/pointbluetechnology/dirxml-dev-web:<version> (+ latest), amd64 + arm64.
# Runs when a release is published, or by hand for a version that already has one. Everything comes
# from GitHub releases (this repo's jar and page) and Maven Central (the libraries the pom pins), so the
# image is reproducible from the tags alone; hosted/docker/build.sh gathers them and refuses any engine jar.
name: image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "DirXMLDevWeb version with a release (e.g. 0.12.0)"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        id: v
        run: |
          VER="${{ github.event.inputs.version || github.event.release.tag_name }}"; VER="${VER#v}"
          CORE=$(sed -n 's#.*<dirxmldev.version>\([^<]*\)</dirxmldev.version>.*#\1#p' pom.xml | head -1)
          SIM=$(sed -n 's#.*<simulator.version>\([^<]*\)</simulator.version>.*#\1#p' pom.xml | head -1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "core=$CORE" >> "$GITHUB_OUTPUT"; echo "sim=$SIM" >> "$GITHUB_OUTPUT"
          echo "web $VER, core $CORE, simulator $SIM"
      - name: This release's jar and page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target web/dist
          gh release download "v${{ steps.v.outputs.ver }}" -p "dirxml-dev-web-${{ steps.v.outputs.ver }}.jar" -p "dirxml-dev-web-page-${{ steps.v.outputs.ver }}.zip" -D target
          unzip -q -o "target/dirxml-dev-web-page-${{ steps.v.outputs.ver }}.zip" -d web/dist
      - name: DirXMLDev (secrets helpers and the Terraform module from the tag)
        uses: actions/checkout@v4
        with:
          repository: PointBlueTechnology/DirXMLDev
          ref: v${{ steps.v.outputs.core }}
          path: DirXMLDev
      - name: DirXMLSimulator (its policy-testing skill, for the agent kit)
        uses: actions/checkout@v4
        with:
          repository: PointBlueTechnology/DirXMLSimulator
          ref: v${{ steps.v.outputs.sim }}
          path: DirXMLSimulator
      - name: The libraries the pom names (dirxml-dev, simulator, trace-core, console-auth, JLDAP, PostgreSQL), from Maven Central
        run: mvn -B -q dependency:resolve
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IDM_HOME: ${{ github.workspace }}/DirXMLDev
          SIM_HOME: ${{ github.workspace }}/DirXMLSimulator
          IDM_SIM_VERSION: ${{ steps.v.outputs.sim }}
          PUSH: "1"
          ALSO_TAG: latest
        run: hosted/docker/build.sh ghcr.io/pointbluetechnology/dirxml-dev-web:${{ steps.v.outputs.ver }}
