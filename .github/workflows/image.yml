# The hosted image on GHCR: ghcr.io/pointbluetechnology/dirxml-dev-web:<version> (+ latest), amd64 + arm64.
# Runs when a release is published, or by hand for a version that already has one. Everything comes
# from GitHub releases — this repo's jar and page, DirXMLDev's jar, the simulator's jar — so the image
# is reproducible from the tags alone; hosted/docker/build.sh gathers them and refuses any engine jar.
name: image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "DirXMLDevWeb version with a release (e.g. 0.12.0)"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        id: v
        run: |
          VER="${{ github.event.inputs.version || github.event.release.tag_name }}"; VER="${VER#v}"
          CORE=$(sed -n 's#.*<dirxmldev.version>\([^<]*\)</dirxmldev.version>.*#\1#p' pom.xml | head -1)
          SIM=$(sed -n 's#.*<simulator.version>\([^<]*\)</simulator.version>.*#\1#p' pom.xml | head -1); SIM=${SIM:-1.7.0}
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "core=$CORE" >> "$GITHUB_OUTPUT"; echo "sim=$SIM" >> "$GITHUB_OUTPUT"
          echo "web $VER, core $CORE, simulator $SIM"
      - name: This release's jar and page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target web/dist
          gh release download "v${{ steps.v.outputs.ver }}" -p "dirxml-dev-web-${{ steps.v.outputs.ver }}.jar" -p "dirxml-dev-web-page-${{ steps.v.outputs.ver }}.zip" -D target
          unzip -q -o "target/dirxml-dev-web-page-${{ steps.v.outputs.ver }}.zip" -d web/dist
      - name: DirXMLDev (its jar from the release; secrets helpers and the Terraform module from the tag)
        uses: actions/checkout@v4
        with:
          repository: PointBlueTechnology/DirXMLDev
          ref: v${{ steps.v.outputs.core }}
          path: DirXMLDev
      - name: DirXMLDev and simulator jars
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY_CONSOLE_TOKEN: ${{ secrets.DIRECTORY_CONSOLE_TOKEN }}
        run: |
          mkdir -p DirXMLDev/target
          gh release download "v${{ steps.v.outputs.core }}" --repo PointBlueTechnology/DirXMLDev -p "dirxml-dev-${{ steps.v.outputs.core }}.jar" -D DirXMLDev/target
          M=~/.m2/repository/com/pointblue/dirxml/dirxml-simulator/${{ steps.v.outputs.sim }}; mkdir -p "$M"
          gh release download "v${{ steps.v.outputs.sim }}" --repo PointBlueTechnology/DirXMLSimulator -p "dirxml-simulator-${{ steps.v.outputs.sim }}.jar" -D "$M"
          TRACE=$(sed -n 's#.*<tracecore.version>\([^<]*\)</tracecore.version>.*#\1#p' pom.xml | head -1)
          T=~/.m2/repository/com/pointbluetech/dirxml-trace-core/$TRACE; mkdir -p "$T"
          gh release download "v$TRACE" --repo PointBlueTechnology/DirXMLTraceViewer -p "dirxml-trace-core-$TRACE.jar" -D "$T"
          PG=$(sed -n 's#.*<postgresql.version>\([^<]*\)</postgresql.version>.*#\1#p' pom.xml | head -1)
          P=~/.m2/repository/org/postgresql/postgresql/$PG; mkdir -p "$P"
          gh release download "v${{ steps.v.outputs.core }}" --repo PointBlueTechnology/DirXMLDev -p "postgresql-$PG.jar" -D "$P"
          J=~/.m2/repository/com/novell/ldap/jldap/4.3; mkdir -p "$J"
          gh release download "v${{ steps.v.outputs.core }}" --repo PointBlueTechnology/DirXMLDev -p "jldap-4.3.jar" -D "$J"
          AUTH=$(sed -n 's#.*<console.version>\([^<]*\)</console.version>.*#\1#p' pom.xml | head -1)
          A=~/.m2/repository/com/pointblue/console/console-auth/$AUTH; mkdir -p "$A"
          # directory-console is private: this download uses a token that can read it
          if [ -z "${DIRECTORY_CONSOLE_TOKEN:-}" ]; then echo "::error::DIRECTORY_CONSOLE_TOKEN is not set: a token that can read PointBlueTechnology/directory-console releases (that repository is private)"; exit 1; fi
          GH_TOKEN="$DIRECTORY_CONSOLE_TOKEN" gh release download "v$AUTH" --repo PointBlueTechnology/directory-console -p "console-auth-$AUTH.jar" -D "$A"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IDM_HOME: ${{ github.workspace }}/DirXMLDev
          IDM_SIM_VERSION: ${{ steps.v.outputs.sim }}
          PUSH: "1"
          ALSO_TAG: latest
        run: hosted/docker/build.sh ghcr.io/pointbluetechnology/dirxml-dev-web:${{ steps.v.outputs.ver }}
      - name: The single-user bundle on the release (setup.sh, compose, config, README — no checkout needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Z="dirxml-dev-web-single-user-${{ steps.v.outputs.ver }}.zip"
          (cd hosted/docker && zip -qr "../../$Z" single-user -x '*/.DS_Store')
          gh release upload "v${{ steps.v.outputs.ver }}" "$Z" --clobber
