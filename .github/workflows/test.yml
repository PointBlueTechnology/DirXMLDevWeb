# Every pull request and push to main: the server's tests (against DirXMLDev's released jar and the
# simulator's) and the page's tests and build. Nothing proprietary is needed: the engine jars are
# absent, and the tests that would need them already run without.
name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: DirXMLDev, simulator, trace parser and console-auth from their releases
        run: bin/install-deps
      - run: mvn -B test
  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
