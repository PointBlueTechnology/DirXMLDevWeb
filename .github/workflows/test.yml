# Every pull request and push to main: the server's tests (against DirXMLDev's released jar and the
# simulator's) and the page's tests and build. Nothing proprietary is needed: the engine jars are
# absent, and the tests that would need them already run without.
name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: DirXMLDev and simulator jars from their releases
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY_CONSOLE_TOKEN: ${{ secrets.DIRECTORY_CONSOLE_TOKEN }}
        run: |
          CORE=$(sed -n 's#.*<dirxmldev.version>\([^<]*\)</dirxmldev.version>.*#\1#p' pom.xml | head -1)
          SIM=$(sed -n 's#.*<simulator.version>\([^<]*\)</simulator.version>.*#\1#p' pom.xml | head -1); SIM=${SIM:-1.7.0}
          gh release download "v$CORE" --repo PointBlueTechnology/DirXMLDev -p "dirxml-dev-$CORE.jar" -D /tmp
          gh release download "v$SIM" --repo PointBlueTechnology/DirXMLSimulator -p "dirxml-simulator-$SIM.jar" -D /tmp
          mvn -B -q install:install-file -Dfile=/tmp/dirxml-dev-$CORE.jar -DgroupId=com.pointblue.dirxml -DartifactId=dirxml-dev -Dversion=$CORE -Dpackaging=jar
          mvn -B -q install:install-file -Dfile=/tmp/dirxml-simulator-$SIM.jar -DgroupId=com.pointblue.dirxml -DartifactId=dirxml-simulator -Dversion=$SIM -Dpackaging=jar
          # the trace viewer's library: its jar carries a module pom with a parent nobody has, so install it with a flat one
          TRACE=$(sed -n 's#.*<tracecore.version>\([^<]*\)</tracecore.version>.*#\1#p' pom.xml | head -1)
          gh release download "v$TRACE" --repo PointBlueTechnology/DirXMLTraceViewer -p "dirxml-trace-core-$TRACE.jar" -D /tmp
          printf '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.pointbluetech</groupId><artifactId>dirxml-trace-core</artifactId><version>%s</version><dependencies><dependency><groupId>com.novell.ldap</groupId><artifactId>jldap</artifactId><version>4.3</version></dependency></dependencies></project>' "$TRACE" > /tmp/trace-core.pom
          mvn -B -q install:install-file -Dfile=/tmp/dirxml-trace-core-$TRACE.jar -DpomFile=/tmp/trace-core.pom
          # Directory Console's console-auth library, from its release; that repository is private, so
          # this download uses a token that can read it (the workflow's own token cannot)
          if [ -z "${DIRECTORY_CONSOLE_TOKEN:-}" ]; then echo "::error::DIRECTORY_CONSOLE_TOKEN is not set: a token that can read PointBlueTechnology/directory-console releases (that repository is private)"; exit 1; fi
          AUTH=$(sed -n 's#.*<console.version>\([^<]*\)</console.version>.*#\1#p' pom.xml | head -1)
          GH_TOKEN="$DIRECTORY_CONSOLE_TOKEN" gh release download "v$AUTH" --repo PointBlueTechnology/directory-console -p "console-auth-$AUTH.jar" -D /tmp
          mvn -B -q install:install-file -Dfile=/tmp/console-auth-$AUTH.jar -DgroupId=com.pointblue.console -DartifactId=console-auth -Dversion=$AUTH -Dpackaging=jar
      - run: mvn -B test
  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
