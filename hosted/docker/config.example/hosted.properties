# /etc/idmweb/hosted.properties inside the container (mounted from ./config)
public.url=https://idmweb.example.com
bind=0.0.0.0
port=8080
data.dir=/var/lib/idmweb
repo.url=https://github.com/PointBlueTechnology/idm-config.git
repo.tokenEnv=IDMWEB_REPO_TOKEN
repo.base=main
repo.tree=tree
repo.cases=cases
catalog.dir=/srv/idm/catalog
environments.file=/etc/idmweb/environments.properties
identity=oidc
oidc.issuer=https://idmweb.example.com/auth/realms/idm
oidc.clientId=idmweb
oidc.clientSecretEnv=IDMWEB_OIDC_SECRET
oidc.groupsClaim=groups
roles.editor=idm-editors,idm-deployers
roles.deployer=idm-deployers
session.hours=8
# agents (CI, an MCP server): Authorization: Bearer <token>
agents=ci:idm-deployers;claude:idm-editors
agent.ci.tokenEnv=IDMWEB_AGENT_CI
agent.claude.tokenEnv=IDMWEB_AGENT_CLAUDE
