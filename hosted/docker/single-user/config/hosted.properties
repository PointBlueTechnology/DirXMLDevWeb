# one person, one container: the smallest hosted configuration
public.url=http://localhost:8080
bind=0.0.0.0
port=8080
data.dir=/var/lib/idmweb
# the first project; setup.sh names it after the tree's directory and the page can add more
projects=PROJECT
project.PROJECT.repo.url=/srv/repo.git
project.PROJECT.repo.base=main
project.PROJECT.repo.tree=tree
project.PROJECT.repo.cases=cases
environments.file=/etc/idmweb/environments.properties
identity=token
token.valueEnv=IDMWEB_TOKEN
# one person on their own machine: the session never times out (hours; a server for a team sets 8 or so)
session.hours=0
token.user=jerry
roles.editor=*
roles.deployer=*
# an agent on this machine (Claude Code, CI, an MCP server): Authorization: Bearer <IDMWEB_AGENT_TOKEN>
agents=agent:
agent.agent.tokenEnv=IDMWEB_AGENT_TOKEN
